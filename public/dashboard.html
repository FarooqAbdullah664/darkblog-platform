<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — DarkBlog</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

<nav class="nav">
  <a class="brand" href="/dashboard.html">
    <div class="logo">DB</div>
    <div class="brand-text">
      <span class="brand-name">DarkBlog</span>
      <span class="brand-sub" id="navSub">Dashboard</span>
    </div>
  </a>
  <div class="nav-links">
    <div class="search-bar" id="navSearch" style="display:none;">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="mobileSearch" placeholder="Search..." />
    </div>
    <a class="btn btn-primary btn-sm" href="/create.html">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Post
    </a>
    <button class="btn btn-outline btn-sm" id="logoutBtn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </button>
  </div>
</nav>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="hero-left">
      <h1 id="welcomeMsg">Welcome back!</h1>
      <p id="welcomeSub">Here's your DarkBlog overview.</p>
    </div>
    <div class="hero-actions">
      <div id="userBadge"></div>
      <a class="btn btn-primary btn-sm" href="/create.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Write Post
      </a>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-icon">📝</div>
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-label">Total Posts</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✍️</div>
      <div class="stat-value" id="statMine">—</div>
      <div class="stat-label">My Posts</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div class="stat-value" id="statAuthors">—</div>
      <div class="stat-label">Authors</div>
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="page-header">
    <h2 class="page-title">All Posts</h2>
    <div class="toolbar">
      <div class="search-bar">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search posts..." />
      </div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">All</button>
        <button class="filter-tab" data-filter="mine">Mine</button>
      </div>
    </div>
  </div>

  <!-- POSTS -->
  <div id="postsContainer" style="min-height:300px;"><div class="spinner"></div></div>

</div>

<footer class="footer">
  <span style="background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700;">DarkBlog</span> 
  &nbsp;·&nbsp; Role-Based Blogging Platform &nbsp;·&nbsp; 
  Built with ❤️ for Portfolio &nbsp;·&nbsp; 
  © 2025
</footer>

<!-- MODAL -->
<div class="modal-overlay" id="readModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
    </div>
    <div class="modal-meta" id="modalMeta"></div>
    <div class="modal-hr"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
  const token    = localStorage.getItem("token");
  const role     = localStorage.getItem("role");
  const fullName = localStorage.getItem("fullName");

  if (!token) location.href = "/login.html";

  document.getElementById("navSub").textContent    = role === "admin" ? "Admin Panel" : "My Dashboard";
  document.getElementById("welcomeMsg").textContent = `Welcome back, ${fullName || "User"}! 👋`;
  document.getElementById("welcomeSub").textContent = role === "admin"
    ? "Admin access — you can manage all posts."
    : "Ready to write something great today?";
  document.getElementById("userBadge").innerHTML =
    `<span class="badge badge-${role}">${role === "admin" ? "🛡 Admin" : "👤 User"}</span>`;

  document.getElementById("logoutBtn").onclick = () => { localStorage.clear(); location.href = "/login.html"; };

  let allBlogs = [], activeFilter = "all";

  async function loadPosts() {
    try {
      const res = await axios.get("/api/blogs");
      allBlogs = res.data.blogs || [];
      updateStats(allBlogs);
      applyFilters();
    } catch {
      document.getElementById("postsContainer").innerHTML =
        `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Failed to load</div><div class="empty-text">Please refresh the page.</div></div>`;
    }
  }

  function updateStats(blogs) {
    document.getElementById("statTotal").textContent   = blogs.length;
    document.getElementById("statMine").textContent    = blogs.filter(b => b.authorName === fullName).length;
    document.getElementById("statAuthors").textContent = new Set(blogs.map(b => b.authorName || "?")).size;
  }

  function applyFilters() {
    const q = document.getElementById("searchInput").value.toLowerCase();
    let list = activeFilter === "mine" ? allBlogs.filter(b => b.authorName === fullName) : allBlogs;
    if (q) list = list.filter(b => b.title.toLowerCase().includes(q) || b.body.toLowerCase().includes(q) || (b.authorName||"").toLowerCase().includes(q));
    renderPosts(list);
  }

  function renderPosts(blogs) {
    const c = document.getElementById("postsContainer");
    if (!blogs.length) {
      c.innerHTML = `<div class="empty-state">
        <div class="empty-icon">📭</div>
        <div class="empty-title">No posts found</div>
        <div class="empty-text">${activeFilter === "mine" ? "You haven't written anything yet." : "Nothing matches your search."}</div>
        <a class="btn btn-primary" href="/create.html">+ Write First Post</a>
      </div>`; return;
    }

    c.innerHTML = `<div class="blog-grid">${blogs.map(b => {
      const init = (b.authorName||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
      const date = new Date(b.createdAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
      const preview = b.body.length > 140 ? b.body.slice(0,140)+"…" : b.body;
      const canDel  = role === "admin" || b.authorName === fullName;
      const isOwn   = b.authorName === fullName;
      return `
        <div class="blog-card" onclick="openModal('${b._id}')">
          <div class="blog-card-bar"></div>
          <div class="blog-card-inner">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <div class="blog-card-label">✦ Article</div>
              ${isOwn ? `<span style="font-size:10px;font-weight:700;color:var(--cyan);letter-spacing:.5px;text-transform:uppercase;">Your post</span>` : ""}
            </div>
            <div class="blog-card-title">${esc(b.title)}</div>
            <div class="blog-card-body">${esc(preview)}</div>
          </div>
          <div class="blog-card-footer">
            <div class="author-info">
              <div class="avatar avatar-xs">${init}</div>
              <div>
                <div class="author-name">${esc(b.authorName||"Unknown")}</div>
                <div class="post-date">${date}</div>
              </div>
            </div>
            <div style="display:flex;gap:5px;" onclick="event.stopPropagation()">
              <button class="btn btn-ghost btn-sm" onclick="openModal('${b._id}')" title="Read post">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                Read
              </button>
              ${canDel ? `<button class="btn btn-danger btn-sm" onclick="deletePost('${b._id}')" title="Delete post">
                <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              </button>` : ""}
            </div>
          </div>
        </div>`;
    }).join("")}</div>`;
  }

  // Filter tabs
  document.querySelectorAll(".filter-tab").forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll(".filter-tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      activeFilter = btn.dataset.filter;
      applyFilters();
    };
  });

  document.getElementById("searchInput").addEventListener("input", applyFilters);

  async function deletePost(id) {
    if (!confirm("Delete this post? This cannot be undone.")) return;
    try {
      await axios.delete("/api/blogs/" + id, { headers: { Authorization: "Bearer " + token } });
      showToast("Post deleted.", "success");
      loadPosts();
    } catch (err) {
      showToast(err.response?.data?.message || "Delete failed.", "error");
    }
  }

  function openModal(id) {
    const b = allBlogs.find(x => x._id === id);
    if (!b) return;
    const init = (b.authorName||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
    const date = new Date(b.createdAt).toLocaleDateString("en-US",{weekday:"long",year:"numeric",month:"long",day:"numeric"});
    document.getElementById("modalTitle").textContent = b.title;
    document.getElementById("modalMeta").innerHTML = `
      <span><div class="avatar avatar-xs" style="display:inline-flex;vertical-align:middle;margin-right:5px;">${init}</div>${esc(b.authorName||"Unknown")}</span>
      <span>
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        ${date}
      </span>`;
    document.getElementById("modalBody").textContent = b.body;
    document.getElementById("readModal").classList.add("open");
    document.body.style.overflow = "hidden";
  }

  document.getElementById("modalClose").onclick = closeModal;
  document.getElementById("readModal").addEventListener("click", e => { if (e.target.id === "readModal") closeModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  function closeModal() {
    document.getElementById("readModal").classList.remove("open");
    document.body.style.overflow = "";
  }

  function showToast(msg, type = "success") {
    const tc = document.getElementById("toastContainer");
    const t = document.createElement("div");
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    tc.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  function esc(s) {
    return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  loadPosts();
</script>
</body>
</html>
