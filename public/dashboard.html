<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard - DarkBlog</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <nav class="nav">
    <div class="brand"><div class="logo">DB</div><div><div style="font-weight:700">DarkBlog</div><div style="font-size:12px;color:var(--muted)">Dashboard</div></div></div>
    <div class="nav-links">
      <a class="btn" href="/index.html">Home</a>
      <a class="btn" href="/create.html">Create</a>
      <button class="btn" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container">
    <div id="welcome" class="card"></div>

    <h3 style="margin-top:16px">All Posts</h3>
    <div id="posts" class="grid"></div>
  </div>

<script>
const token = localStorage.getItem("token");
const role = localStorage.getItem("role");
const fullName = localStorage.getItem("fullName");

if(!token){
  // redirect to login if not logged in
  location.href = "/login.html";
}

document.getElementById("logoutBtn").onclick = () => {
  localStorage.removeItem("token");
  localStorage.removeItem("role");
  localStorage.removeItem("fullName");
  location.href = "/index.html";
}

document.getElementById("welcome").innerHTML = `
  <h2>Welcome, ${escapeHtml(fullName || "User")}</h2>
  <p style="color:var(--muted)">Role: ${escapeHtml(role)}</p>
`;

async function loadPosts(){
  try{
    const res = await axios.get("/api/blogs");
    const blogs = res.data.blogs || [];
    if(blogs.length === 0){
      document.getElementById("posts").innerHTML = "<p class='card'>No posts yet.</p>";
      return;
    }
    const html = blogs.map(b => `
      <div class="card">
        <div class="h-title">${escapeHtml(b.title)}</div>
        <div class="meta">By ${b.authorName || (b.author && b.author.fullName) || "Unknown"} • ${new Date(b.createdAt).toLocaleString()}</div>
        <div style="color:var(--muted);margin-bottom:12px">${escapeHtml(truncate(b.body,200))}</div>
        ${role === "admin" ? `<div class="align-right"><button class="btn btn-ghost" data-id="${b._id}" onclick="deletePost('${b._id}')">Delete</button></div>` : ""}
      </div>
    `).join("");
    document.getElementById("posts").innerHTML = html;
  }catch(err){
    console.error(err);
    document.getElementById("posts").innerHTML = "<p class='card'>Failed to load posts.</p>";
  }
}

async function deletePost(id){
  if(!confirm("Delete this post?")) return;
  try{
    await axios.delete("/api/blogs/" + id, { headers: { Authorization: token } });
    alert("Deleted");
    loadPosts();
  }catch(err){
    alert(err.response?.data?.message || "Failed to delete");
  }
}

function truncate(text, n){ return text.length > n ? text.slice(0,n) + "..." : text; }
function escapeHtml(unsafe){
  if(!unsafe) return "";
  return unsafe.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

loadPosts();
</script>
</body>
</html>
