<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Post - DarkBlog</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <nav class="nav">
    <div class="brand"><div class="logo">DB</div><div><div style="font-weight:700">DarkBlog</div><div style="font-size:12px;color:var(--muted)">Create</div></div></div>
    <div class="nav-links">
      <a class="btn" href="/index.html">Home</a>
      <a class="btn" href="/dashboard.html">Dashboard</a>
      <a class="btn" href="/login.html">Login</a>
    </div>
  </nav>

  <div class="container">
    <form id="createForm" class="card">
      <h2 style="text-align:center;color:var(--accent)">Create New Post</h2>
      <input class="input" id="title" placeholder="Title" />
      <textarea class="input" id="body" placeholder="Write your post..."></textarea>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" type="submit">Publish</button>
        <div id="msg" style="color:var(--muted)"></div>
      </div>
    </form>
  </div>

<script>
document.getElementById("createForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const token = localStorage.getItem("token");
  if(!token) return location.href = "/login.html";

  const title = document.getElementById("title").value.trim();
  const body = document.getElementById("body").value.trim();
  const msg = document.getElementById("msg");

  if(!title || !body) { msg.innerText = "Please enter title and body"; return; }

  try {
    const res = await axios.post("/api/blogs", { title, body }, {
      headers: { Authorization: token } // server accepts raw token or "Bearer token"
    });
    msg.style.color = "lightgreen";
    msg.innerText = res.data.message || "Created";
    setTimeout(()=> location.href="/index.html", 900);
  } catch(err) {
    msg.style.color = "#ff8080";
    msg.innerText = err.response?.data?.message || "Failed";
  }
});
</script>
</body>
</html>
