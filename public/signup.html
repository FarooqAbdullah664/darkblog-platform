<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Signup - DarkBlog</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
  <nav class="nav">
    <div class="brand"><div class="logo">DB</div><div><div style="font-weight:700">DarkBlog</div><div style="font-size:12px;color:var(--muted)">Signup</div></div></div>
    <div class="nav-links">
      <a class="btn" href="/index.html">Home</a>
      <a class="btn" href="/login.html">Login</a>
    </div>
  </nav>

  <div class="container">
    <form id="signupForm" class="card">
      <h2 style="text-align:center;color:var(--accent)">Create Account</h2>
      <input class="input" id="fullName" placeholder="Full Name" required />
      <input class="input" id="email" type="email" placeholder="Email" required />
      <input class="input" id="password" type="password" placeholder="Password" required />
      <select class="input" id="role">
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" type="submit">Sign Up</button>
        <div id="msg" style="color:var(--muted)"></div>
      </div>
      <p style="margin-top:12px;color:var(--muted)">Already registered? <a href="/login.html">Login</a></p>
    </form>
  </div>

<script>
document.getElementById("signupForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  const msg = document.getElementById("msg");
  msg.innerText = "";

  if(!fullName || !email || !password) { msg.innerText = "Please fill all fields"; return; }

  try {
    const res = await axios.post("/api/signup", { fullName, email, password, role });
    msg.style.color = "lightgreen";
    msg.innerText = res.data.message || "Registered";
    setTimeout(()=> location.href="/login.html", 1200);
  } catch(err){
    msg.style.color = "#ff8080";
    msg.innerText = err.response?.data?.message || "Server Error";
  }
});
</script>
</body>
</html>
